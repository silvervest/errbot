name: Build and publish Docker image

on:
  push:
    branches: [main]
  # Allows a manual rebuild (e.g. to pick up a new python:3.13-alpine base) without a commit
  workflow_dispatch:

# Only one publish at a time; a newer push supersedes an in-flight build so :latest
# always ends up reflecting the most recent commit
concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for GITHUB_TOKEN to push to ghcr.io
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/silvervest/errbot:latest
          # Links the ghcr package to this repo, so the package page shows the source
          # and the repo's workflow is recognised as having access to it
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
